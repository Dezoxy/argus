name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    # Code scanning / SARIF upload needs GitHub Advanced Security, which is unavailable on a user-owned
    # PRIVATE repo (and not included in Pro). Skip on private so it doesn't fail every run; this auto-revives
    # if the repo is ever made public again. Semgrep/OSV/Trivy/gitleaks still cover SAST/deps/secrets.
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
